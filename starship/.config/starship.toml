# --- ROOT ---
format = """
[┌](bold white)$username$directory$git_branch$git_status$nodejs$python
[└](bold white)$character
"""
add_newline = true

# --- CORE ---

[character]
success_symbol = "[❯](bold cyan)"
error_symbol = "[✖](bold red)"

[username]
show_always = true
style_user = "bold white"
format = "[$user]($style)@"

[directory]
truncation_length = 3
style = "bold cyan"
format = "[$path]($style) "

# --- GIT (SEÑAL CRÍTICA) ---

[git_branch]
symbol = " "
style = "bold green"
format = "[$symbol$branch]($style) "

[git_status]
style = "bold yellow"
format = "([$all_status$ahead_behind]($style)) "

# --- RUNTIMES (SOLO SI EXISTEN) ---

[nodejs]
symbol = " "
style = "bold blue"
format = "[$symbol($version)]($style) "

detect_extensions = ["js", "ts", "tsx", "jsx"]

[python]
symbol = " "
style = "bold blue"
format = "[$symbol($version)]($style) "

detect_extensions = ["py"]
